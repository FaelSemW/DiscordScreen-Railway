<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Compartilhar Tela</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background: var(--bg-main);
      color: var(--text-main);
      margin: 0;
      padding: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    .picker-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: #0f121a;
      -webkit-app-region: drag;
    }
    .picker-header h2 {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }
    .picker-close {
      -webkit-app-region: no-drag;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
    }
    .picker-close:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }
    .picker-tabs {
      display: flex;
      gap: 12px;
      padding: 12px 20px 0;
      border-bottom: 1px solid var(--border);
      background: var(--bg-card);
    }
    .picker-tab {
      padding: 10px 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      border: none;
      background: none;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.15s ease;
    }
    .picker-tab:hover {
      color: var(--text-main);
    }
    .picker-tab.active {
      color: var(--primary);
      border-bottom-color: var(--primary);
    }
    .picker-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px 20px;
    }
    .sources-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 16px;
    }
    .source-card {
      background: var(--bg-card);
      border: 2px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      flex-direction: column;
    }
    .source-card:hover {
      border-color: #3b4255;
      transform: translateY(-2px);
    }
    .source-card.selected {
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(88, 101, 242, 0.4);
    }
    .source-thumb {
      width: 100%;
      height: 120px;
      background: #000;
      object-fit: cover;
      display: block;
    }
    .source-info {
      padding: 8px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: #11141e;
    }
    .source-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }
    .source-name {
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--text-main);
    }
    .picker-footer {
      padding: 14px 20px;
      background: #0f121a;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .audio-toggle-container {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .audio-toggle-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-main);
    }
    .audio-toggle-label input[type="checkbox"] {
      width: 16px;
      height: 16px;
      accent-color: var(--primary);
      cursor: pointer;
    }
    .audio-toggle-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-left: 24px;
    }
    .picker-actions {
      display: flex;
      gap: 10px;
    }
  </style>
</head>
<body>
  <div class="picker-header">
    <h2>Compartilhar Tela</h2>
    <button id="btn-close" class="picker-close" title="Fechar">✕</button>
  </div>

  <div class="picker-tabs">
    <button id="tab-screens" class="picker-tab active">Tela Inteira</button>
    <button id="tab-windows" class="picker-tab">Aplicativos</button>
  </div>

  <div class="picker-content">
    <div id="sources-grid" class="sources-grid">
      <!-- Fontes renderizadas via JS -->
    </div>
  </div>

  <div class="picker-footer">
    <div class="audio-toggle-container">
      <label class="audio-toggle-label">
        <input type="checkbox" id="check-system-audio" checked />
        <span id="audio-toggle-text">Compartilhar áudio do sistema</span>
      </label>
      <span class="audio-toggle-sub" id="audio-toggle-sub">Transmite todo o áudio do computador (jogos, mídia e som do sistema).</span>
    </div>

    <div class="picker-actions">
      <button id="btn-cancel" class="btn btn-outline">Cancelar</button>
      <button id="btn-share" class="btn btn-primary" disabled>Compartilhar</button>
    </div>
  </div>

  <script src="picker.js"></script>
</body>
</html>
